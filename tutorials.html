	<div class="projectControls">

		<div class="keywordFilter">
			<button type="button" id="keywordButton">

			Clear filters
		</button>

<div id="projectList"></div>

<script>
const projects = [

    {
        title: "Making Research Accessible",
        link: "tutorials/Access.html",
        icon: "assets/libbook.jpg",
        description: "HTML ways to make your research more open and accessible for a wider audience.",
        keywords: ["HTML", "research", "accessibility", "open science"],
        date: "2026-09-01"
    },

    {
        title: "Soft bodies in Mujoco",
        link: "tutorials/softbodies.html",
        icon: "assets/tutorials/soft/Screenshot from 2026-06-11 14-49-56.png",
        description: "Tutorial for creating soft bodies in the Mujoco simulator.",
        keywords: ["MuJoCo", "simulation", "soft bodies", "robotics"],
        date: "2026-06-11"
    },

    {
        title: "Data logging device",
        link: "tutorials/datalogging.html",
        icon: "assets/tutorials/46090.jpg",
        description: "Construct a Raspberry Pi Pico datalogger for activity prediction with machine learning.",
        keywords: ["Raspberry Pi", "Pico", "data logging", "machine learning", "hardware"],
        date: "2026-05-01"
    },

    {
        title: "OpenEduBot Sim2Real",
        link: "tutorials/openEduBot.html",
        icon: "assets/tutorials/wheelBot2.jpg",
        description: "Using a simple light following robot and working towards simulation to reality.",
        keywords: ["robotics", "simulation", "Sim2Real", "OpenEduBot"],
        date: "2026-04-01"
    },

    {
        title: "Robot arm control",
        link: "tutorials/robotarm.html",
        icon: "https://github.com/shepai/Robot_shape_learning/raw/main/Assets/Gifs/task2_fast.gif",
        description: "In this tutorial we use the Mujoco simulator with a robot arm for completing tasks, then implement a LLM for decision making for the robot.",
        keywords: ["MuJoCo", "robotics", "robot arm", "LLM", "AI", "simulation"],
        date: "2026-03-01"
    },

    {
        title: "Evolving neural controller robot",
        link: "https://shep-ai.medium.com/evolving-a-robot-to-walk-using-python-83417ca3df2a",
        icon: "assets/biped1.PNG",
        description: "In this tutorial we talk you through the process of making a biped teach itself to walk.",
        keywords: ["robotics", "neural networks", "evolution", "walking robots", "Python"],
        date: "2026-02-01"
    },

    {
        title: "GA self learning robot",
        link: "tutorials/GARobotTutorial.html",
        icon: "assets/biped.jpg",
        description: "In this tutorial we use a genetic algorithm to get a robot to teach itself to walk.",
        keywords: ["robotics", "genetic algorithms", "evolution", "walking robots"],
        date: "2026-01-01"
    },

    {
        title: "Setting up an AI server",
        link: "tutorials/server.html",
        icon: "assets/server.JPG",
        description: "In this tutorial we will be setting up an AI server where you will be able to communicate with your AI via a network.",
        keywords: ["AI", "server", "networking", "Linux", "hardware"],
        date: "2025-12-01"
    },

    {
        title: "Setting up a voice recognition Raspberry Pi AI",
        link: "tutorials/voiceRecognition.html",
        icon: "assets/aiboard.PNG",
        description: "This tutorial will show you how to set up the respeaker hat and make your own AI chatbot.",
        keywords: ["Raspberry Pi", "AI", "voice recognition", "chatbot", "hardware"],
        date: "2025-11-01"
    },

    {
        title: "Making a SHEP Cube companion",
        link: "tutorials/build.html",
        icon: "assets/smallEYE.jpg",
        description: "This tutorial will show you how to set up your very own SHEP companion which uses voice recognition and text to speech. It will cover setting up an I2S microphone, configuring the Pi and installing hats.",
        keywords: ["Raspberry Pi", "AI", "voice recognition", "text to speech", "hardware", "SHEP"],
        date: "2025-10-01"
    }

];


// --------------------------------------------------
// SETTINGS
// --------------------------------------------------

const projectsPerPage = 10;

let currentPage = 1;
let selectedKeywords = [];


// --------------------------------------------------
// SORT PROJECTS BY DATE
// Newest first
// --------------------------------------------------

projects.sort((a, b) => new Date(b.date) - new Date(a.date));


// --------------------------------------------------
// CREATE UNIQUE KEYWORD LIST
// --------------------------------------------------

function createKeywordList() {

    const keywordDropdown = document.getElementById("keywordDropdown");

    const allKeywords = [
        ...new Set(
            projects.flatMap(project => project.keywords)
        )
    ];

    allKeywords.sort((a, b) => a.localeCompare(b));

    keywordDropdown.innerHTML = "";

    allKeywords.forEach(keyword => {

        const label = document.createElement("label");
        label.className = "keywordOption";

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.value = keyword;

        checkbox.addEventListener("change", function() {

            if (this.checked) {
                selectedKeywords.push(keyword);
            } else {
                selectedKeywords =
                    selectedKeywords.filter(k => k !== keyword);
            }

            currentPage = 1;
            renderProjects();

        });

        label.appendChild(checkbox);
        label.appendChild(
            document.createTextNode(keyword)
        );

        keywordDropdown.appendChild(label);

    });

}


// --------------------------------------------------
// FILTER PROJECTS
// --------------------------------------------------

function getFilteredProjects() {

    if (selectedKeywords.length === 0) {
        return projects;
    }

    return projects.filter(project => {

        // OR filtering:
        // project appears if it contains ANY selected keyword

        return selectedKeywords.some(keyword =>
            project.keywords.includes(keyword)
        );

    });

}


// --------------------------------------------------
// DISPLAY PROJECTS
// --------------------------------------------------

function renderProjects() {

    const projectList =
        document.getElementById("projectList");

    const filteredProjects =
        getFilteredProjects();

    const totalPages =
        Math.ceil(filteredProjects.length / projectsPerPage);

    // Make sure current page still exists
    if (currentPage > totalPages && totalPages > 0) {
        currentPage = totalPages;
    }

    const start =
        (currentPage - 1) * projectsPerPage;

    const end =
        start + projectsPerPage;

    const pageProjects =
        filteredProjects.slice(start, end);


    let html = `
        <table class="projectTable">
    `;


    pageProjects.forEach((project, index) => {

        // Alternate based on the actual position
        // on the current page.
        const imageLeft = index % 2 === 0;


        if (imageLeft) {

            html += `
                <tr>
                    <th>
                        <a href="${project.link}">
                            <img
                                class="imageCircle2 projectImage"
                                src="${project.icon}"
                                alt="${project.title}"
                            >
                        </a>
                    </th>

                    <th>
                        <a
                            class="projectTitle"
                            href="${project.link}"
                        >
                            ${project.title}
                        </a>

                        <p class="textInfo projectDescription">
                            ${project.description}
                        </p>
                    </th>
                </tr>
            `;

        } else {

            html += `
                <tr>
                    <th>
                        <a
                            class="projectTitle"
                            href="${project.link}"
                        >
                            ${project.title}
                        </a>

                        <p class="textInfo projectDescription">
                            ${project.description}
                        </p>
                    </th>

                    <th>
                        <a href="${project.link}">
                            <img
                                class="imageCircle2 projectImage"
                                src="${project.icon}"
                                alt="${project.title}"
                            >
                        </a>
                    </th>
                </tr>
            `;

        }

    });


    html += `</table>`;

    projectList.innerHTML = html;

    renderPagination(totalPages);

}


// --------------------------------------------------
// PAGINATION
// --------------------------------------------------

function renderPagination(totalPages) {

    const pagination =
        document.getElementById("pagination");

    pagination.innerHTML = "";

    if (totalPages <= 1) {
        return;
    }


    // Previous button

    if (currentPage > 1) {

        const previous =
            document.createElement("button");

        previous.textContent = "← Previous";

        previous.onclick = function() {
            currentPage--;
            renderProjects();
            window.scrollTo(0, 0);
        };

        pagination.appendChild(previous);

    }


    // Page numbers

    for (let page = 1; page <= totalPages; page++) {

        const button =
            document.createElement("button");

        button.textContent = page;

        if (page === currentPage) {
            button.classList.add("active");
        }

        button.onclick = function() {

            currentPage = page;

            renderProjects();

            window.scrollTo(0, 0);

        };

        pagination.appendChild(button);

    }


    // Next button

    if (currentPage < totalPages) {

        const next =
            document.createElement("button");

        next.textContent = "Next →";

        next.onclick = function() {

            currentPage++;

            renderProjects();

            window.scrollTo(0, 0);

        };

        pagination.appendChild(next);

    }

}


// --------------------------------------------------
// KEYWORD DROPDOWN
// --------------------------------------------------

document
    .getElementById("keywordButton")
    .addEventListener("click", function() {

        document
            .getElementById("keywordDropdown")
            .classList.toggle("show");

    });


// --------------------------------------------------
// CLEAR FILTERS
// --------------------------------------------------

document
    .getElementById("clearFilters")
    .addEventListener("click", function() {

        selectedKeywords = [];

        currentPage = 1;

        document
            .querySelectorAll("#keywordDropdown input")
            .forEach(checkbox => {
                checkbox.checked = false;
            });

        renderProjects();

    });


// --------------------------------------------------
// INITIALISE
// --------------------------------------------------

createKeywordList();

renderProjects();
</script>
